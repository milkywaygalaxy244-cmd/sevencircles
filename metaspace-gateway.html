<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METASPACE // LOADING...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* Loading Screen Setup */
        #loading-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #555;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #222;
            border-top: 3px solid #ff3333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* The Glitch Tear Animation Overlay */
        #tear-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 9;
            display: none;
            pointer-events: none;
        }

        /* Game Interface */
        #game-container {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            background: #050505;
        }

        canvas {
            background: #111;
            border: 2px solid #333;
            box-shadow: 0 0 30px rgba(255,0,0,0.2);
        }

        /* Death/Lock Screen */
        #lock-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #7a0000;
            color: #fff;
            z-index: 99999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>

    </div>
